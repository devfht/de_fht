<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Backoffice · Fht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/admin.css?v=2">
</head>
<body>

  <!-- LOGIN GATE -->
  <div class="gate" id="gate">
    <form class="gate-box" id="gateForm">
      <h1><span class="ico ico-script">&lt;&gt;</span> Backoffice</h1>
      <p>Espace privé — édition du site Fht</p>
      <input type="password" id="gatePass" placeholder="Mot de passe" autocomplete="current-password" autofocus>
      <div class="gate-err" id="gateErr"></div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Entrer</button>
    </form>
  </div>

  <!-- APP -->
  <div id="app" hidden>
    <div class="topbar">
      <span class="title"><span class="ico ico-script">&lt;&gt;</span> Backoffice · Fht</span>
      <span class="save-state" id="saveState"><span class="dot"></span><span id="saveText">Brouillon local</span></span>
      <span class="size-chip" id="sizeState" title=""></span>
      <span class="spacer"></span>
      <button class="btn" id="btnPreview" title="Ouvrir un aperçu du site avec tes modifs">↗ Aperçu</button>
      <button class="btn" id="btnImport">Importer…</button>
      <button class="btn btn-danger" id="btnReset">Réinitialiser</button>
      <button class="btn" id="btnDownload" title="Sauvegarde locale du fichier">⤓ Télécharger</button>
      <span class="publish-chip" id="publishState"></span>
      <button class="btn btn-primary" id="btnPublish" title="Met le site en ligne à jour">⇧ Publier en ligne</button>
      <input type="file" id="importFile" accept=".js,.json,application/json,text/javascript" hidden>
    </div>

    <div class="admin">
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-label">SECTIONS</div>
        <button class="nav-item active" data-sec="identite"><span class="ico ico-script">&lt;&gt;</span> Identité</button>
        <button class="nav-item" data-sec="stats"><span class="ico ico-model">▦</span> Statistiques</button>
        <button class="nav-item" data-sec="jeux"><span class="ico ico-model">▦</span> Jeux</button>
        <button class="nav-item" data-sec="clips"><span class="ico ico-folder">▤</span> Clips</button>
        <button class="nav-item" data-sec="commissions"><span class="ico ico-server">≡</span> Commissions</button>
        <button class="nav-item" data-sec="footer"><span class="ico ico-gear">●</span> Pied de page</button>
        <button class="nav-item" data-sec="ia"><span class="ico ico-ai">✦</span> Assistant IA</button>
        <button class="nav-item" data-sec="publication"><span class="ico ico-pub">⇧</span> Publication</button>
      </nav>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="contenu.js?v=2"></script>
  <script src="assets/js/admin.js?v=2"></script>

</body>
</html>
